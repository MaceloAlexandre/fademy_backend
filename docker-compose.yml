# Ambiente local: PostgreSQL e MongoDB (imagens no GridFS) — docs/ARQUITETURA.md, seção 9.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fademy
      POSTGRES_USER: fademy
      POSTGRES_PASSWORD: fademy
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  postgres-data:
  mongo-data:

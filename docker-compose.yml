# Ambiente local: bancos e armazenamento de imagens (docs/ARQUITETURA.md, seção 9).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fademy
      POSTGRES_USER: fademy
      POSTGRES_PASSWORD: fademy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Armazenamento de imagens compatível com S3. Leitura anônima no bucket "fademy"
  # (infra/seaweedfs-s3.json).
  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - ./infra/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

  # Cria o bucket "fademy" e termina.
  criar-bucket:
    image: amazon/aws-cli
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: fademy
      AWS_SECRET_ACCESS_KEY: fademy123
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "until aws --endpoint-url http://seaweedfs:8333 s3 ls >/dev/null 2>&1; do sleep 1; done &&
             aws --endpoint-url http://seaweedfs:8333 s3 mb s3://fademy || true"

volumes:
  postgres-data:
  mongo-data:
  seaweedfs-data:

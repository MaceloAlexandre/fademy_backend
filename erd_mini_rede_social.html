
<div id="erd"></div>
<style>
#erd svg { max-width: 100%; }
#erd svg .label { font-family: var(--font-sans) !important; }
</style>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryTextColor: dark ? '#CECBF6' : '#3C3489',
    primaryBorderColor: dark ? '#534AB7' : '#AFA9EC',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    secondaryTextColor: dark ? '#9FE1CB' : '#085041',
    secondaryBorderColor: dark ? '#0F6E56' : '#5DCAA5',
    tertiaryColor: dark ? '#3B6D11' : '#EAF3DE',
    tertiaryTextColor: dark ? '#C0DD97' : '#3B6D11',
    tertiaryBorderColor: dark ? '#639922' : '#97C459',
  },
});

const diagram = `erDiagram
  INSTITUTIONS {
    ObjectId id PK
    string name
    string slug
    string logoUrl
    boolean active
    timestamp createdAt
  }

  USERS {
    ObjectId id PK
    ObjectId institutionId FK
    string name
    string email
    string passwordHash
    string avatarUrl
    enum role
    boolean isPrivate
    boolean active
    timestamp createdAt
  }

  INVITES {
    ObjectId id PK
    ObjectId institutionId FK
    ObjectId invitedById FK
    string email
    enum roleTarget
    string token
    enum status
    timestamp expiresAt
    timestamp createdAt
  }

  FOLLOWS {
    ObjectId id PK
    ObjectId followerId FK
    ObjectId followingId FK
    enum status
    timestamp createdAt
  }

  BLOCKS {
    ObjectId id PK
    ObjectId blockerId FK
    ObjectId blockedId FK
    timestamp createdAt
  }

  CATEGORIES {
    ObjectId id PK
    string name
    string slug
    enum type
  }

  POSTS {
    ObjectId id PK
    ObjectId authorId FK
    string text
    array imageUrls
    array categoryIds FK
    boolean hasLink
    timestamp createdAt
  }

  COMMENTS {
    ObjectId id PK
    ObjectId postId FK
    ObjectId authorId FK
    string text
    timestamp createdAt
  }

  NOTIFICATIONS {
    ObjectId id PK
    ObjectId userId FK
    ObjectId actorId FK
    enum type
    ObjectId refId
    string refModel
    boolean read
    timestamp createdAt
  }

  CONVERSATIONS {
    ObjectId id PK
    array memberIds FK
    string name
    boolean isGroup
    boolean isPublic
    ObjectId createdById FK
    timestamp updatedAt
  }

  MESSAGES {
    ObjectId id PK
    ObjectId conversationId FK
    ObjectId senderId FK
    string text
    array mediaUrls
    timestamp createdAt
  }

  INSTITUTIONS ||--o{ USERS : "tem"
  INSTITUTIONS ||--o{ INVITES : "gera"
  USERS ||--o{ INVITES : "envia"
  USERS ||--o{ POSTS : "cria"
  USERS ||--o{ COMMENTS : "comenta"
  USERS ||--o{ FOLLOWS : "segue"
  USERS ||--o{ BLOCKS : "bloqueia"
  USERS ||--o{ NOTIFICATIONS : "recebe"
  USERS ||--o{ MESSAGES : "envia"
  POSTS ||--o{ COMMENTS : "tem"
  CATEGORIES ||--o{ POSTS : "classifica"
  CONVERSATIONS ||--o{ MESSAGES : "contém"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>

spring.application.name=fademy-api
server.port=${PORT:8080}
fademy.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
fademy.bcrypt-rounds=${BCRYPT_ROUNDS:10}
fademy.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@fademy.com}
fademy.admin.senha=${BOOTSTRAP_ADMIN_PASSWORD:changeme}
fademy.admin.nome=${BOOTSTRAP_ADMIN_NAME:Admin}
# Em produção, defina JWT_SECRET; o padrão serve só para desenvolvimento e apresentação local.
fademy.jwt.segredo=${JWT_SECRET:fademy-segredo-de-desenvolvimento-troque-em-producao}
fademy.jwt.validade=${JWT_EXPIRES_IN:7d}
# Imagens no MongoDB (GridFS), servidas pela própria API em GET /api/media/<chave>. Na rede
# local, troque IMAGENS_URL_PUBLICA pelo IP da máquina para os celulares abrirem as fotos.
fademy.imagens.url-publica=${IMAGENS_URL_PUBLICA:http://localhost:8080/api/media}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_BYTES:5MB}
spring.servlet.multipart.max-request-size=25MB
# O Tomcat descarta no máximo 2 MB de um upload rejeitado e depois derruba a conexão; o
# cliente veria erro de rede em vez do 400 "File upload error". Lê até o tamanho máximo.
server.tomcat.max-swallow-size=25MB
